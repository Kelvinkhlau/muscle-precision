name: MusclePrecision
options:
  bundleIdPrefix: com.kelvinlau
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.kelvinlau.muscleprecision
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO
schemes:
  MusclePrecision:
    build:
      targets:
        MusclePrecision: all
        MusclePrecisionTests: [test]
    test:
      targets:
        - MusclePrecisionTests
targets:
  MusclePrecision:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
      - Data
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: MusclePrecision
  MusclePrecisionTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: MusclePrecision
    sources:
      - Tests
    resources:
      - Data
    dependencies:
      - target: MusclePrecision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
