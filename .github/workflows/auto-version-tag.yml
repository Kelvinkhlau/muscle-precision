name: Auto Version Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-version-tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute Next Tag
        id: version
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          head_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1 || true)"
          if [ -n "$head_tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=HEAD already tagged with $head_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
            commit_messages="$(git log --format=%B)"
          else
            commit_messages="$(git log --format=%B "${latest_tag}..HEAD")"
          fi

          bump="${BUMP_INPUT:-auto}"
          if [ "$bump" = "auto" ]; then
            if echo "$commit_messages" | grep -Eiq 'BREAKING CHANGE|!:'; then
              bump="major"
            elif echo "$commit_messages" | grep -Eiq '^feat(\(.+\))?:'; then
              bump="minor"
            else
              bump="patch"
            fi
          fi

          current="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$current"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump type: $bump"
              exit 1
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=Tag already exists: $new_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and Push Tag
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Workflow Summary
        run: |
          {
            echo "## Auto Version Tag"
            if [ "${{ steps.version.outputs.skip }}" = "true" ]; then
              echo "- Skipped: ${{ steps.version.outputs.reason }}"
            else
              echo "- Previous tag: ${{ steps.version.outputs.latest_tag }}"
              echo "- Bump type: ${{ steps.version.outputs.bump }}"
              echo "- New tag: ${{ steps.version.outputs.new_tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
